name: Feature or idea
description: Suggest a new site, effect, mode, or improvement
title: "[idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see? What problem or experience does it serve?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio / synthesis
        - Visuals / rendering
        - New recovered site
        - Systems / narrative
        - Accessibility
        - Platform / installation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Sketches, references, prior art, or how it fits the fiction. See docs/ROADMAP.md for existing direction.
